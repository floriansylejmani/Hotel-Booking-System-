name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hotel_user
          POSTGRES_PASSWORD: hotel_password
          POSTGRES_DB: hotel_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel_user -d hotel_booking"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=hotel_booking;Username=hotel_user;Password=hotel_password
      JwtSettings__Key: CI_SECRET_KEY_123456789012345678901234567890
      JwtSettings__Issuer: HotelBookingSystem
      JwtSettings__Audience: HotelBookingSystem
      JwtSettings__ExpirationMinutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore backend
        run: dotnet restore

      - name: Build backend
        run: dotnet build --no-restore

      - name: Test backend with coverage
        run: dotnet test --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Verify backend coverage output
        run: test -n "$(find TestResults -name 'coverage.cobertura.xml' -print -quit)"

      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend with coverage
        run: npm run test:coverage

      - name: Verify frontend coverage output
        run: test -d coverage && test -f coverage/index.html

      - name: Build frontend
        run: npm run build

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/**
          if-no-files-found: error
